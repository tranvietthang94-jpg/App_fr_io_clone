version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fr-clone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: frclone
      POSTGRES_PASSWORD: frclone123
      POSTGRES_DB: frclone
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — dev DB must not face the LAN
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frclone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fr-clone-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # loopback only — dev Redis has no password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fr-clone-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: frclone
      MINIO_ROOT_PASSWORD: frclone123
    ports:
      - "127.0.0.1:9000:9000"   # API — loopback only (default dev creds)
      - "127.0.0.1:9001:9001"   # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data: